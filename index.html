<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7f2" media="(prefers-color-scheme: light)" />
    <meta name="description" content="AeroWatch — Real-time UAV weather intelligence. Live conditions anywhere on Earth, explainable flight-risk scoring, A* storm-avoiding route planning, and an AI flight assistant." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AeroWatch" />
    <meta property="og:title" content="AeroWatch — UAV Weather Intelligence" />
    <meta property="og:description" content="Live weather anywhere on Earth, explainable flight-risk scoring, A* route planning, and an AI flight assistant for drone operators." />
    <meta property="og:url" content="https://aero-watch-delta.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AeroWatch — UAV Weather Intelligence" />
    <meta name="twitter:description" content="Live weather anywhere on Earth, explainable flight-risk scoring, A* route planning, and an AI flight assistant for drone operators." />
    <link rel="canonical" href="https://aero-watch-delta.vercel.app/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply persisted theme before any CSS loads — prevents flash
      try {
        var t = localStorage.getItem('aero-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>AeroWatch — UAV Weather Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
