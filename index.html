<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280" />
    <meta name="description" content="AeroWatch — Real-time UAV weather intelligence. Wind, visibility, precipitation, and storm-cell tracking for unmanned aerial vehicles." />
    <script>
      // Apply persisted theme before any CSS loads — prevents flash
      try {
        var t = localStorage.getItem('aero-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>AeroWatch — UAV Weather Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
